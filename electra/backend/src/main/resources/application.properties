# Load the local configuration when launched from the project root or backend directory.
# OS environment variables continue to take precedence over these optional files.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]
server.port=${SERVER_PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/manager}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
api.security.token.secret=${JWT_SECRET}
manager.integrations.master-key=${INTEGRATION_MASTER_KEY:}
manager.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
server.error.include-message=never
server.error.include-stacktrace=never
# Conta de administrador garantida a cada subida. Em branco, usa o padrao do
# codigo; troque o padrao antes de publicar o projeto num repositorio aberto.
manager.seed.admin.email=${SEED_ADMIN_EMAIL:}
manager.seed.admin.password=${SEED_ADMIN_PASSWORD:}
manager.seed.admin.name=${SEED_ADMIN_NAME:Administrador}
# Redefine a senha do administrador na proxima subida; para quem perdeu o acesso.
manager.seed.admin.reset=${SEED_ADMIN_RESET:false}

# Gravações enviadas ao Drive: multipart vai para disco, sem carregar todo o vídeo no heap.
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=513MB
spring.servlet.multipart.file-size-threshold=0
