<!doctype html>
<meta charset="utf-8" />
<title>QA Manager</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; height: 100vh; display: grid; place-items: center;
    background: #0b0d17;
    background-image: radial-gradient(700px 320px at 50% 12%, rgba(99,102,241,.22), transparent 65%);
    color: #e8e9f3;
    font: 14px/1.6 Inter, "Segoe UI", system-ui, sans-serif;
  }
  .box { text-align: center; }
  .mark {
    width: 62px; height: 62px; margin: 0 auto 20px; border-radius: 18px;
    display: grid; place-items: center; font-weight: 800; font-size: 22px; color: #fff;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    box-shadow: 0 14px 34px -12px rgba(99,102,241,.85);
  }
  h1 {
    margin: 0 0 6px; font-size: 26px; letter-spacing: -.7px;
    background: linear-gradient(100deg, #818cf8, #c084fc);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p { margin: 0; color: #9aa0b4; }
  .bar {
    width: 240px; height: 4px; margin: 26px auto 0; border-radius: 99px;
    background: rgba(255,255,255,.08); overflow: hidden;
  }
  .bar span {
    display: block; width: 40%; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #6366f1, #a855f7);
    animation: slide 1.25s ease-in-out infinite;
  }
  @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(260%) } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100% } }
</style>
<div class="box">
  <div class="mark">QA</div>
  <h1>QA Manager</h1>
  <p>Preparando o banco de dados e os serviços…</p>
  <p style="margin-top:4px;font-size:12px;opacity:.7">A primeira execução leva mais tempo.</p>
  <div class="bar"><span></span></div>
</div>
