services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-manager}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - manager-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-manager}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no .env}
      DB_DDL_AUTO: update
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?Preencha JWT_SECRET no .env}
      INTEGRATION_MASTER_KEY: ${INTEGRATION_MASTER_KEY:?Preencha INTEGRATION_MASTER_KEY no .env}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  manager-data:
